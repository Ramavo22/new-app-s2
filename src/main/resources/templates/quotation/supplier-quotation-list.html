<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Custom Hamburger Sidebar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div th:insert="~{/general/sidebar.html}"></div>

<!-- Content -->
<div class="container mt-5">
    <a class="btn btn-primary" th:href="@{/suppliers}"><i class="fa-solid fa-arrow-left"></i> Return to Supplier List</a>
    <p class="h2"> Supplier Quotation List For <span th:text="${supplier_name}"></span> </p>
    <hr>
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th scope="col">References</th>
            <th scope="col">Transaction_date</th>
            <th scope="col">total_qty</th>
            <th scope="col">net_total</th>
            <th scope="col">valid_till</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(quotations)}">
            <td colspan="6" class="text-center">Aucune donnée disponible</td>
        </tr>
         <tr th:each="quotation : ${quotations}">
             <td th:text="${quotation.name}"></td>
             <td th:text="${quotation.transaction_date}"></td>
             <td th:text="${quotation.total_qty}"></td>
             <td th:text="${quotation.net_total}"></td>
             <td th:text="${quotation.valid_till}"></td>
             <td><a th:href="@{/quotation/{name}/{ref}(name=${quotation.supplier},ref=${quotation.name})}" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> See More</a> </td>
         </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/generalJs.js}"></script>
</body>
</html>
