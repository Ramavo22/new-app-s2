<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Custom Hamburger Sidebar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div th:insert="~{/general/sidebar.html}"></div>

<!-- Content -->
<div class="container mt-5">
    <p class="h1">Update Rate for <span th:text="${sqItem.item_code}"> </span> from <span th:text="${sqItem.parent}"> </span></p>
    <div class="d-flex justify-content-center vh-100">
        <form th:action="@{/quotation/details/{ref}(ref=${sqItem.name})}" method="post">
            <div class="mb-3">
                <label for="newrate" class="form-label">New Rate</label>
                <input type="number" name="newrate" class="form-control" id="newrate" th:value="${sqItem.rate}" >
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/generalJs.js}"></script>
</body>
</html>
