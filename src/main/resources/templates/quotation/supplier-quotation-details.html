<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Custom Hamburger Sidebar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div th:insert="~{/general/sidebar.html}"></div>

<!-- Content -->

<div class="container mt-5">
    <div>
        <h1>Supplier Quotation Details</h1>
        <p>References: <span th:text="${quotation.name}"></span> </p>
        <p>Supplier: <span th:text="${quotation.supplier}"></span></p>
        <p>Total quantity: <span th:text="${quotation.total_qty}"></span></p>
        <p>net total: <span th:text="${quotation.net_total}"></span> </p>
        <p>status: <span th:text="${quotation.status}"></span></p>
        <p>Valid till:<span th:text="${quotation.valid_till}"></span></p>
    </div>
    <hr>
    <div>
        <p th:if="${message}" th:text="${message}" class="alert alert-success"></p>
        <p th:if="${error}" th:text="${error}" class="alert-danger alert"></p>
        <p class="h3" >Items list</p>
        <form th:action="@{/quotation/update-all-rates}" method="post">
            <table class="table table-bordered table-hover">
                <input type="hidden" th:name="quotationName" th:value="${quotation.name}">
                <input type="hidden" th:name="supplier" th:value="${quotation.supplier}">
                <thead>
                <tr>
                    <th scope="col">Reference</th>
                    <th scope="col">Item Code</th>
                    <th scope="col">Item Name</th>
                    <th scope="col">Quantity</th>
                    <th scope="col">Rate</th>
                    <th scope="col">Amount</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, iter : ${quotation.items}">
                    <td>
                        <input type="hidden" th:name="items[__${iter.index}__].item_code" th:value="${item.name}" />
                        <span th:text="${item.name}"></span>
                    </td>
                    <td th:text="${item.item_code}"></td>
                    <td th:text="${item.item_name}"></td>
                    <td>
                        <div th:text="${item.qty}"></div>
                    </td>

                    ```
                    <td>
                        <div th:if="${quotation.status == 'Draft'}">
                            <input type="number" step="0.01"
                                   class="form-control form-control-sm"
                                   th:name="items[__${iter.index}__].rate"
                                   th:value="${item.rate}" />
                        </div>
                        <div th:if="${quotation.status != 'Draft'}" th:text="${item.rate}"></div>
                    </td>

                    <td th:text="${item.amount}"></td>
                </tr>
                </tbody>
            </table>

            <div th:if="${quotation.status == 'Draft'}">
                <button type="submit" class="btn btn-success">Save all rates</button>
            </div>
        </form>


    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/generalJs.js}"></script>

</body>
</html>
