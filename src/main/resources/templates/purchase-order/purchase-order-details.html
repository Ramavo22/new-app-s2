<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails de la Purchase Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- Sidebar -->
<div th:insert="~{/general/sidebar.html}"></div>

<!-- Contenu principal -->
<div class="container mt-5">
    <h1 class="mb-4">Détails de la Purchase Order</h1>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Informations Générales</h5>
            <p><strong>Numéro :</strong> <span th:text="${purchaseOrderDetails.name}"></span></p>
            <p><strong>Fournisseur :</strong> <span th:text="${purchaseOrderDetails.supplier}"></span></p>
            <p><strong>Date de transaction :</strong> <span th:text="${purchaseOrderDetails.transactionDate}"></span></p>
            <p><strong>Montant total :</strong> <span th:text="${purchaseOrderDetails.grandTotal} + ' Ar'"></span></p>
            <p><strong>Statut :</strong> <span th:text="${purchaseOrderDetails.status}"></span></p>
            <p><strong>% Facturé :</strong> <span th:text="${purchaseOrderDetails.perBilled} + ' %'"></span></p>
            <p><strong>% Reçu: </strong> <span th:text="${purchaseOrderDetails.perReceived} + ' %'"></span></p>
            <p><strong>Statut de paiement :</strong> <span th:text="${purchaseOrderDetails.paymentStatus}"></span></p>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Factures associées</h5>
            <table class="table table-bordered table-striped">
                <thead class="table-light">
                <tr>
                    <th>Référence</th>
                    <th>Date</th>
                    <th>Montant</th>
                    <th>Montant restant à payé</th>
                    <th>Statut</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="invoice : ${purchaseOrderDetails.invoices}">
                    <td th:text="${invoice.invoice}"></td>
                    <td th:text="${invoice.postingDate}"></td>
                    <td th:text="${invoice.grandTotal} + ' Ar'"></td>
                    <td th:text="${invoice.outstandingAmount} + ' Ar'"></td>
                    <td>
                            <span th:classappend="'badge ' + (${invoice.status} == 'Payée' ? 'bg-success' : 'bg-danger')"
                                  th:text="${invoice.status}"></span>
                    </td>
                </tr>
                <tr th:if="${purchaseOrderDetails.invoices.empty}">
                    <td colspan="5" class="text-center">Aucune facture trouvée.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/generalJs.js}"></script>
</body>
</html>
