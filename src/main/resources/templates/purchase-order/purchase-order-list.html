<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Custom Hamburger Sidebar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div th:insert="~{/general/sidebar.html}"></div>

<!-- Content -->
<div class="container mt-5">
    <p class="h1">Purchase Order List</p>
    <table class="table table-bordered">
        <tr>
            <th scope="col">reference</th>
            <th scope="col">supplier</th>
            <th scope="col">transaction date</th>
            <th scope="col">total qty</th>
            <th scope="col">net total</th>
            <th scope="col">status</th>
            <th scope="col">Action</th>
        </tr>
        <tr th:if="${#lists.isEmpty(purchase_orders)}">
            <td colspan="7" class="text-center">Aucune donnée disponible</td>
        </tr>
        <tr th:each="purchase_order : ${purchase_orders}">
            <td th:text="${purchase_order.name}"></td>
            <td th:text="${purchase_order.supplier}"></td>
            <td th:text="${purchase_order.transaction_date}"></td>
            <td th:text="${purchase_order.total_qty}"></td>
            <td th:text="${purchase_order.net_total}"></td>
            <td th:text="${purchase_order.status}"></td>
            <td>
                <a th:href="@{/purchase-order/{name}/{ref}(name=${purchase_order.supplier},ref=${purchase_order.name})}" class="btn btn-primary">See Details</a>
            </td>
        </tr>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/generalJs.js}"></script>
</body>
</html>
