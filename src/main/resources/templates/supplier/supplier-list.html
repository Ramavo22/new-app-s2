<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Custom Hamburger Sidebar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div th:insert="~{/general/sidebar.html}"></div>

<!-- Content -->
<div class="container mt-5">
    <p class="h2"> Supplier List</p>
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th scope="col">Supplier Name</th>
            <th scope="col">Supplier Type</th>
            <th scope="col">Country</th>
            <th scope="col">Quotation</th>
            <th scope="col">Purchase Order</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="supplier : ${suppliers}">
            <td th:text="${supplier.supplier_name}"></td>
            <td th:text="${supplier.supplier_type}"></td>
            <td th:text="${supplier.country}"></td>
            <td><a th:href="@{/quotation/{name}(name=${supplier.supplier_name})}" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> See Supplier quotation</a></td>
            <td><a th:href="@{/purchase-order/{name}(name=${supplier.supplier_name})}" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> See Purchase Order</a></td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/generalJs.js}"></script>
</body>
</html>
