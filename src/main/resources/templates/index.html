<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
  	<title>Login 10</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	</head>
  <body class="img js-fullheight" th:style="|background-image: url('@{/images/bg2.jpg}');|">
	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">
					<h2 class="heading-section">ERPNEXT New App</h2>
				</div>
			</div>
			<div class="row justify-content-center">
				<div class="col-md-6 col-lg-4">
					<div class="login-wrap p-0">
						<h3 class="mb-4 text-center">Login</h3>
						<p th:if="${message}" th:text="${message}" class="text-danger"></p>
						<form th:action="@{/login}" class="signin-form" method="post">
							<div class="form-group">
								<input type="text" name="usr" class="form-control" placeholder="Username" required>
							</div>
						<div class="form-group">
						  <input id="password-field" name="pwd" type="password" class="form-control" placeholder="Password" required>
						  <span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password"></span>
						</div>
						<div class="form-group">
							<button type="submit" class="form-control btn btn-primary submit px-3">Sign In</button>
						</div>
					  </form>
		      		</div>
				</div>
			</div>
		</div>
	</section>

	<script th:src="@{/js/jquery.min.js}"></script>
  <script th:src="@{/js/popper.js}"></script>
  <script th:src="@{/js/bootstrap.min.js}"></script>
  <script th:src="@{/js/main.js}"></script>

	</body>
</html>
