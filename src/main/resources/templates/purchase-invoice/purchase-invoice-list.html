<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Custom Hamburger Sidebar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div th:insert="~{/general/sidebar.html}"></div>

<!-- Content -->
<div class="container mt-5">
    <p class="h1">Purchase Invoice List</p>
    <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>
    <p th:if="${message}" th:text="${message}" class="alert alert-success"></p>
    <table class="table table-bordered">
        <tr>
            <th scope="col">references</th>
            <th scope="col">supplier</th>
            <th scope="col">due date</th>
            <th scope="col">total qty</th>
            <th scope="col">net total</th>
            <th scope="col">status</th>
            <th scope="col">Action</th>
        </tr>
        <tr th:each="purchase_invoice : ${purchase_invoices}">
            <td th:text="${purchase_invoice.name}"></td>
            <td th:text="${purchase_invoice.supplier}"></td>
            <td th:text="${purchase_invoice.due_date}"></td>
            <td th:text="${purchase_invoice.total_qty}"></td>
            <td th:text="${purchase_invoice.net_total}"></td>
            <td th:text="${purchase_invoice.status}"></td>
            <td th:switch="${purchase_invoice.status}">
                <a th:case="Paid" disabled class="btn btn-success">Paid</a>
                <a th:case="*" th:href="@{/purchase-invoice/{ref}/validation(ref=${purchase_invoice.name})}" class="btn btn-primary">Pay</a>
            </td>
        </tr>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/generalJs.js}"></script>
</body>
</html>
